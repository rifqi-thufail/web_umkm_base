# Message bus (NATS JetStream) and peer registry (Consul) for the local Mpcium cluster.
# Both listen on loopback only. NATS requires the per-role credentials that setup.sh writes to
# cluster/nats.conf; see mpc/PRODUCTION.md for TLS and Consul ACLs in a real deployment.
name: ${MPC_PROJECT:-ampuh-mpc}

services:
  nats:
    image: nats:2.10.29
    container_name: ${MPC_PROJECT:-ampuh-mpc}-nats
    command: -c /etc/nats/nats.conf
    volumes:
      - ${MPC_HOME:-./cluster}/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "127.0.0.1:${MPC_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${MPC_NATS_MONITOR_PORT:-8222}:8222"
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.20.6
    container_name: ${MPC_PROJECT:-ampuh-mpc}-consul
    # Holds the peer registry and per-wallet key metadata (participants, threshold): without it the
    # nodes cannot sign, so it lives on a named volume rather than in the container.
    command: agent -server -node=server-1 -bootstrap-expect=1 -client=0.0.0.0 -data-dir=/consul/data
    volumes:
      - consul-data:/consul/data
    ports:
      - "127.0.0.1:${MPC_CONSUL_PORT:-8500}:8500"
    restart: unless-stopped

volumes:
  nats-data:
  consul-data:
