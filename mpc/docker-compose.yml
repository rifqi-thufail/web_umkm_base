# Message bus (NATS JetStream) and peer registry (Consul) for the local Mpcium cluster.
services:
  nats:
    image: nats:2.10
    container_name: ampuh-mpc-nats
    command: -js --http_port 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  consul:
    image: consul:1.15.4
    container_name: ampuh-mpc-consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"
    restart: unless-stopped
